    function Hero3DCanvas() {
      const mountRef = useRef(null);

      useEffect(() => {
        const container = mountRef.current;
        if (!container) return;

        const width = container.clientWidth;
        const height = container.clientHeight;

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 100);
        camera.position.z = 4.5;

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // Core Glowing Mesh
        const sphereGeo = new THREE.IcosahedronGeometry(1.3, 4);
        const sphereMat = new THREE.MeshPhysicalMaterial({
          color: 0x2563eb,
          emissive: 0x3b82f6,
          emissiveIntensity: 0.35,
          roughness: 0.15,
          metalness: 0.2,
          wireframe: true
        });
        const sphereMesh = new THREE.Mesh(sphereGeo, sphereMat);
        scene.add(sphereMesh);

        // Inner Core Geometry
        const innerGeo = new THREE.SphereGeometry(0.75, 16, 16);
        const innerMat = new THREE.MeshBasicMaterial({ color: 0x0284c7, wireframe: true });
        const innerMesh = new THREE.Mesh(innerGeo, innerMat);
        scene.add(innerMesh);

        // Orbital Ring
        const ringGeo = new THREE.TorusGeometry(1.95, 0.02, 16, 100);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0x60a5fa, transparent: true, opacity: 0.75 });
        const ringMesh = new THREE.Mesh(ringGeo, ringMat);
        ringMesh.rotation.x = Math.PI / 3;
        scene.add(ringMesh);

        // Ambient Lights
        const ambLight = new THREE.AmbientLight(0xffffff, 1.2);
        scene.add(ambLight);

        const pointLight = new THREE.PointLight(0x3b82f6, 2.5, 10);
        pointLight.position.set(2, 3, 4);
        scene.add(pointLight);

        let animationFrameId;
        const animate = () => {
          sphereMesh.rotation.y += 0.004;
          sphereMesh.rotation.x += 0.002;
          innerMesh.rotation.y -= 0.006;
          ringMesh.rotation.z += 0.003;
          renderer.render(scene, camera);
          animationFrameId = requestAnimationFrame(animate);
        };
        animate();

        const handleResize = () => {
          if (!container) return;
          const w = container.clientWidth;
          const h = container.clientHeight;
          camera.aspect = w / h;
          camera.updateProjectionMatrix();
          renderer.setSize(w, h);
        };
        window.addEventListener('resize', handleResize);

        return () => {
          cancelAnimationFrame(animationFrameId);
          window.removeEventListener('resize', handleResize);
          if (container && renderer.domElement) {
            container.removeChild(renderer.domElement);
          }
        };
      }, []);

      return <div ref={mountRef} className="w-full h-full min-h-[280px] sm:min-h-[380px] flex items-center justify-center relative" />;
    }

    function TypingSpeedTest() {
      const sampleText = "Let the weather be the weather while building crazy weekend ideas.";
      const [input, setInput] = useState("");
      const [startTime, setStartTime] = useState(null);
      const [wpm, setWpm] = useState(null);
      const [isCompleted, setIsCompleted] = useState(false);

      const handleInputChange = (e) => {
        const val = e.target.value;
        if (!startTime) setStartTime(Date.now());
        setInput(val);

        if (val === sampleText) {
          const timeElapsedInMinutes = (Date.now() - startTime) / 60000;
          const words = sampleText.split(" ").length;
          const calculatedWpm = Math.round(words / timeElapsedInMinutes);
          setWpm(calculatedWpm);
          setIsCompleted(true);
        }
      };

      const resetTest = () => {
        setInput("");
        setStartTime(null);
        setWpm(null);
        setIsCompleted(false);
      };

      return (
        <div className="bg-slate-50 rounded-2xl p-5 border border-slate-200 space-y-4">
          <div className="flex items-center justify-between">
            <span className="text-xs font-mono font-bold text-slate-700 uppercase tracking-wider flex items-center gap-2">
              <i data-lucide="keyboard" className="w-4 h-4 text-blue-600"></i> Interactive WPM Tester
            </span>
            {wpm !== null && (
              <span className="px-3 py-1 bg-emerald-100 text-emerald-800 border border-emerald-300 rounded-full text-xs font-mono font-bold animate-bounce">
                ⚡ {wpm} WPM!
              </span>
            )}
          </div>

          <p className="text-xs font-mono text-slate-800 bg-white p-3.5 rounded-xl border border-slate-200 shadow-sm leading-relaxed">
            "{sampleText}"
          </p>

          <input
            type="text"
            value={input}
            onChange={handleInputChange}
            disabled={isCompleted}
            placeholder="Type the exact sentence above..."
            className="w-full bg-white border border-slate-300 focus:border-blue-600 rounded-xl px-4 py-2.5 text-xs text-slate-900 focus:outline-none transition-colors font-mono shadow-inner"
          />

          <div className="flex items-center justify-between text-xs text-slate-500 font-mono">
            <span>{isCompleted ? "🎉 Completed!" : "Start typing to test speed."}</span>
            <button 
              onClick={resetTest} 
              className="text-blue-600 hover:underline flex items-center gap-1 font-semibold"
            >
              <i data-lucide="rotate-ccw" className="w-3.5 h-3.5"></i> Reset
            </button>
          </div>
        </div>
      );
    }
